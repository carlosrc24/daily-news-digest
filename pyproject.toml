[project]
name = "daily-news-digest"
version = "1.0.0"
description = "Daily economy, geopolitics and technology briefing: RSS -> Gemini -> HTML email."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic characters (·, …, —) are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
