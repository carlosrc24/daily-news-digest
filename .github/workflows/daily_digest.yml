name: Daily digest

on:
  schedule:
    # Target: 07:30 Europe/Madrid, so the email is in the inbox before 08:00 even
    # though GitHub often starts scheduled runs 5-30 minutes late.
    # GitHub cron only speaks UTC, so there is one entry per DST period and the
    # `gate` job below lets through only the one matching Madrid's current offset.
    - cron: "30 5 * * *" # 07:30 CEST (summer, UTC+2)
    - cron: "30 6 * * *" # 07:30 CET  (winter, UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate without sending (HTML is uploaded as an artifact)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Pick the cron entry that matches local time
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LOCAL_TZ: Europe/Madrid
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Compare against the cron that fired, not the clock, so late starts don't matter.
          offset=$(TZ="$LOCAL_TZ" date +%z)
          case "$offset" in
            +0200) expected="30 5 * * *" ;;
            +0100) expected="30 6 * * *" ;;
            *) echo "::error::Unexpected UTC offset '$offset' for $LOCAL_TZ"; exit 1 ;;
          esac
          if [ "$SCHEDULE" = "$expected" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: '$SCHEDULE' is the cron for the other DST period (offset $offset)"
          fi

  digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          # Optional non-secret settings: Settings > Secrets and variables > Actions > Variables
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          DIGEST_LANGUAGE: ${{ vars.DIGEST_LANGUAGE }}
          ARTICLES_PER_CATEGORY: ${{ vars.ARTICLES_PER_CATEGORY }}
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload rendered HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_id }}
          path: output/digest.html
          if-no-files-found: ignore
          retention-days: 7
